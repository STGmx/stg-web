# Despliegue Netlify — sitio estático exportado por Next.js
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Los assets con hash de Next pueden cachearse para siempre
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
